name: CI

on:
  push:
    branches: [main]
  pull_request:

# 检查仅需仓库读取权限。
permissions:
  contents: read

jobs:
  # 验证实际发布包，不将源码运行通过视为安装成功。
  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:package

  # 准备阶段联网获取固定快照；扫描不安装或执行样本依赖。
  public-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare pinned source snapshots
        # 只读令牌仅发送给 api.github.com，避免共享 runner IP 的匿名限额导致偶发失败。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-evaluation-projects.mjs "$RUNNER_TEMP/canship-projects"
      - name: Evaluate source snapshots offline
        run: npm run evaluate:projects -- "$RUNNER_TEMP/canship-projects"

  # 验证组合 Action 的安装、摘要和失败策略；不上传报告。
  action-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Create isolated scan targets
        shell: bash
        run: |
          node --input-type=module -e "
            import { mkdirSync, writeFileSync } from 'node:fs';
            for (const name of ['clean', 'open']) mkdirSync('action-smoke/' + name, { recursive: true });
            writeFileSync('action-smoke/clean/index.ts', 'export const ready = true;');
            writeFileSync('action-smoke/open/firestore.rules', 'service cloud.firestore { match /documents/{id} { allow write: if true; } }');
          "
      - name: Clean target passes
        uses: ./
        with:
          path: action-smoke/clean
          fail-on: any
      - name: Open rules fail
        id: open
        continue-on-error: true
        uses: ./
        with:
          path: action-smoke/open
      - name: Check blocking outcome
        if: ${{ steps.open.outcome != 'failure' || steps.open.outputs.exit-code != '1' || steps.open.outputs.blocking != '1' }}
        shell: bash
        run: exit 1

  # 在支持测试加载方式的 Node 版本上执行完整检查。
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          # 历史规则需完整提交记录。
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 使用最低支持版本验证构建产物。
  oldest-supported-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 18
      - name: The built CLI runs on Node 18
        run: |
          node dist/cli.js --version
          # 将夹具复制到临时目录，避免继承当前仓库状态；临时目录变量必须有效。
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          cp -r test/fixtures/clean-nextjs test/fixtures/vulnerable-nextjs "$RUNNER_TEMP/"
          node dist/cli.js "$RUNNER_TEMP/clean-nextjs"
          # 漏洞夹具必须退出 1，其他非零状态不能视为成功。
          set +e
          node dist/cli.js "$RUNNER_TEMP/vulnerable-nextjs"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected exit code 1 on the vulnerable fixture, got $status"
            exit 1
          fi

  # 用构建后的扫描器检查自身源码。
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: canship does not report its own source
        run: |
          set +e
          node dist/cli.js . --json > self.json
          status=$?
          set -e
          # 夹具中的隐藏疑似结果可导致退出 2；退出 1 或 3 均失败。
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "self-scan exited $status"
            cat self.json
            exit 1
          fi
          # 默认结果须为空，同时断言扫描完整且实际读取了文件。
          node --input-type=commonjs -e "
            const r = JSON.parse(require('fs').readFileSync('self.json', 'utf8'))
            if (r.findings.length > 0 || r.partial || r.errors.length > 0 ||
                r.skipped.length > 0 || r.filesScanned === 0) {
              console.error(JSON.stringify(r.findings, null, 2))
              process.exit(1)
            }
          "
