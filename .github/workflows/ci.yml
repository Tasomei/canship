name: CI

on:
  push:
    branches: [main]
  pull_request:

# 检查仅需仓库读取权限。
permissions:
  contents: read

jobs:
  # 在支持测试加载方式的 Node 版本上执行完整检查。
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # 历史规则需完整提交记录。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 使用最低支持版本验证构建产物。
  oldest-supported-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: The built CLI runs on Node 18
        run: |
          node dist/cli.js --version
          # 将夹具复制到临时目录，避免继承当前仓库状态；临时目录变量必须有效。
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          cp -r test/fixtures/clean-nextjs test/fixtures/vulnerable-nextjs "$RUNNER_TEMP/"
          node dist/cli.js "$RUNNER_TEMP/clean-nextjs"
          # 漏洞夹具必须退出 1，其他非零状态不能视为成功。
          set +e
          node dist/cli.js "$RUNNER_TEMP/vulnerable-nextjs"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected exit code 1 on the vulnerable fixture, got $status"
            exit 1
          fi

  # 用构建后的扫描器检查自身源码。
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: canship does not report its own source
        run: |
          set +e
          node dist/cli.js . --json > self.json
          status=$?
          set -e
          # 夹具中的隐藏疑似结果可导致退出 2；退出 1 或 3 均失败。
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "self-scan exited $status"
            cat self.json
            exit 1
          fi
          # 默认结果须为空，同时断言扫描完整且实际读取了文件。
          node --input-type=commonjs -e "
            const r = JSON.parse(require('fs').readFileSync('self.json', 'utf8'))
            if (r.findings.length > 0 || r.partial || r.errors.length > 0 ||
                r.skipped.length > 0 || r.filesScanned === 0) {
              console.error(JSON.stringify(r.findings, null, 2))
              process.exit(1)
            }
          "
