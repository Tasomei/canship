name: Publish

# 版本标签触发暂存；稳定版使用 latest，预发布使用 next，均需人工批准。
# 使用可信发布（OIDC），不保存 npm 令牌；即使工作流被攻破，也无法绕过人工批准直接发布。
on:
  push:
    tags: ['v*']

# 默认不授予任何权限，各任务单独声明。
permissions: {}

# 同一时间只进行一次发布，不取消正在进行的发布。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # 安装依赖、运行全部检查并打包。此任务会执行依赖的安装脚本和项目代码，因此不持有发布权限。
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # 需要完整历史以确认标签提交位于 main。
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag, version and branch
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          # 用检出后的 HEAD 而不是 GITHUB_SHA，附注标签也解析为其指向的提交。
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
          if npm view "canship@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::canship@$version is already published."
            exit 1
          fi
      - run: npm ci
      # 与本地 npm publish 前执行的检查相同：类型检查、测试、构建。
      - run: npm run prepublishOnly
      - run: node scripts/package-smoke.mjs
      - name: Verify release build identity
        shell: bash
        run: |
          node --input-type=module -e "
            import {getBuildInfo} from './dist/index.js';
            import {execFileSync} from 'node:child_process';
            const build=getBuildInfo();
            const revision=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            if(build.channel==='development'||build.dirty!==false||build.revision!==revision)process.exit(1);
          "
      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          tarball="$(cd "$RUNNER_TEMP/package" && ls -- *.tgz)"
          sha256="$(sha256sum "$RUNNER_TEMP/package/$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed \`$tarball\` (sha256 \`$sha256\`)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 固定 v7.0.1 提交
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # 只暂存上一步测试过的压缩包，不检出源码、不安装依赖、不运行任何项目脚本。
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 须与 npmjs.com 可信发布配置中的环境名一致；可在仓库设置中为该环境添加发布前人工确认。
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 固定 v8.0.1 提交
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Verify the package
        id: package
        shell: bash
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/package/$TARBALL"
          actual="$(sha256sum "$file" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::The package changed between build and publish."
            exit 1
          fi
          manifest="$(tar -xzOf "$file" package/package.json)"
          name="$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "$manifest")"
          version="$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$manifest")"
          if [ "$name" != "canship" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The package is $name@$version, not canship@${GITHUB_REF_NAME#v}."
            exit 1
          fi
          # 从已校验压缩包的版本选择标签，不执行包内代码或读取项目配置。
          node --input-type=module - "$version" <<'RELEASE_CHANNEL'
          import { appendFileSync } from 'node:fs';
          const version = process.argv[2];
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.exec(version ?? '');
          if (!match || match[0] !== version || version.length > 256 ||
              !match.slice(1, 4).every(part => Number.isSafeInteger(Number(part))) ||
              match[4]?.split('.').some(part => /^[0-9]+$/.test(part) && part.length > 1 && part.startsWith('0'))) {
            console.error('::error::Expected an exact release version without build metadata.');
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `npm_tag=${match[4] ? 'next' : 'latest'}\n`);
          RELEASE_CHANNEL
          # 暂存发布要求 npm 11.15.0 及以上。
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number)
            if (a < 11 || (a === 11 && b < 15)) {
              console.error(`::error::npm ${process.argv[1]} is too old for staged publishing; 11.15.0 or later is required.`)
              process.exit(1)
            }' "$(npm --version)"
      # 暂存发布的来源证明默认关闭，须显式开启。
      - name: Stage for approval
        shell: bash
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          NPM_TAG: ${{ steps.package.outputs.npm_tag }}
        run: |
          set -euo pipefail
          case "$NPM_TAG" in latest|next) ;; *) echo "::error::Missing or invalid release channel."; exit 1 ;; esac
          npm stage publish "$RUNNER_TEMP/package/$TARBALL" --tag "$NPM_TAG" --registry=https://registry.npmjs.org --provenance --ignore-scripts
          echo "Staged \`$TARBALL\` with tag \`$NPM_TAG\`. Approve it on npmjs.com (canship → Staged Packages) with two-factor authentication to make it public." >> "$GITHUB_STEP_SUMMARY"
