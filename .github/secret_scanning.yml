# Everything under test/ is credential-shaped on purpose.
#
# A detection rule is only worth having if two fixtures exist for it: one that
# must be reported and one that must not. Both have to look like the real thing,
# so secret scanning finds them every time, and every finding is the same answer
# — "used in tests". An alert stream where every entry is dismissed is one
# nobody reads, which is the state to avoid on a repository whose alerts should
# mean something.
#
# What this gives up is real, and worth stating rather than assuming away:
# paths-ignore turns off push protection here too, and canship's own dogfood job
# does not cover the difference. It grades anything under a test directory as
# scaffolding, drops it to `likely`, and the job asserts on the default view —
# which shows `certain` only. A real credential pasted into test/ reaches the
# repository unchallenged, and `canship . --all` is the only thing that names it.
#
# Accepted because the scanning being switched off could not tell a real
# credential from a fixture either: it blocked twenty-four literal x's. What is
# lost is noise that was indistinguishable from signal, in the one directory
# where signal cannot exist. src/ — where a credential would actually ship —
# stays scanned, with push protection.
#
# Revisit this the day test/ stops being fixtures: an integration test reading a
# real key from the environment would invert the trade.
paths-ignore:
  - "test/**"
